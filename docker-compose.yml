version: "3.11"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env   # ✅ This line loads your OPENAI_API_KEY

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
